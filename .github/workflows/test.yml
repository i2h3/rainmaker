name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/Documentation.docc/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/Documentation.docc/**'
  workflow_dispatch:

# Pinned to macos-26 instead of macos-latest on purpose: the macos-latest
# label is mid-migration to macOS 26 (rolling out from 2026-06-15), so runs
# randomly land on either macos-15-arm64 or macos-26-arm64. On the macos-15
# image, `latest-stable` selects Xcode 26.3 while its bundled simulator
# runtimes only go up to 26.2, so `OS:latest` destinations (watchOS/visionOS)
# fail to resolve. macos-26-arm64 ships Xcode 26.5 with matching 26.5 runtimes
# for every platform, so the destinations below resolve deterministically.
# Revisit (back to macos-latest) once the migration completes.
jobs:
  test-macos:
    name: macOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Show Swift version
        run: swift --version
      
      - name: Run tests
        run: swift test

  test-ios:
    name: iOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: List available simulators
        run: xcrun simctl list devices available
      
      - name: Run tests on iOS Simulator
        run: |
          xcodebuild test \
            -scheme Rainmaker-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -enableCodeCoverage YES

  test-tvos:
    name: tvOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Run tests on tvOS Simulator
        run: |
          xcodebuild test \
            -scheme Rainmaker-Package \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -enableCodeCoverage YES

  test-watchos:
    name: watchOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Run tests on watchOS Simulator
        run: |
          xcodebuild test \
            -scheme Rainmaker-Package \
            -destination 'platform=watchOS Simulator,name=Apple Watch Series 11 (46mm)' \
            -enableCodeCoverage YES

  test-visionos:
    name: visionOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run tests on visionOS Simulator
        run: |
          xcodebuild test \
            -scheme Rainmaker-Package \
            -destination 'platform=visionOS Simulator,name=Apple Vision Pro' \
            -enableCodeCoverage YES

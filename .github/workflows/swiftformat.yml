name: SwiftFormat

on:
  pull_request:
    paths:
      - '**/*.swift'

jobs:
  Lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat
        run: swiftformat --lint . --reporter github-actions-log
name: SwiftFormat

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '**/*.swift'

jobs:
  Lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat
        run: swiftformat --lint . --reporter github-actions-log